# Configuraci�n de PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgres
quarkus.datasource.username=postgres
#quarkus.datasource.password=tu_contrase�a

# Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=true

# logs
quarkus.log.file.enabled=true
quarkus.log.file.path=logs/api-formula-1.log
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c] %s%e%n
quarkus.log.file.rotation.rotate-on-boot=true
quarkus.log.category."org.elias".level=DEBUG

# Suprimir logs internos de conexion fallida (el arranque los reemplaza con un mensaje limpio)
quarkus.log.category."io.agroal".level=OFF
quarkus.log.category."io.quarkus.hibernate.orm.runtime.schema".level=OFF
quarkus.log.category."io.quarkus.hibernate.orm.runtime.ser".level=OFF
quarkus.log.category."org.hibernate.orm.jdbc.error".level=OFF

#Cors
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS